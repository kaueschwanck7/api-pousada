info:
  name: 01 - Listar Reservas
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/reservas"
  auth: inherit

assert:
  - expr: res.status
    operator: eq
    value: 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
