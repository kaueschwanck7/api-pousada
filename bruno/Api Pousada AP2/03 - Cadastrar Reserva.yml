info:
  name: 03 - Cadastrar Reserva
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/reservas"
  auth: inherit
  body:
    type: json
    data: |
      {
        "nomeHospede": "Juliana Ferreira Santos",
        "dataCheckin": "2026-12-01",
        "dataCheckout": "2026-12-05",
        "numeroQuarto": 305,
        "quantidadeHospedes": 2,
        "status": "Confirmada"
      }

assert:
  - expr: res.status
    operator: eq
    value: 201

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
